<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Anti-CLS: fuentes locales se PRELOAD de inmediato (el CSS bundle
		     que las referencia llega con la SPA; pre-cargar los woff2 evita el
		     swap tardío de Orbitron que re-fluía la barra al refrescar). -->
		<link rel="preload" href="/fonts/orbitron-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/orbitron-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
