# rls-captain-frontend nginx (TASK-008): estaticos SPA + proxy /api al backend.
# REQ-031: las rutas del frontend son relativas; este server funciona en
# cualquier dominio detras del reverse proxy TLS del usuario.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compresion (DEC-006: assets minimos) -------------------------------
    gzip on;
    gzip_vary on;              # => Vary: Accept-Encoding
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # --- Assets inmutables de SvelteKit (hashed) → cache 1 año -------------
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback: cualquier ruta sirve app shell index.html ------------
    # REQ-031 fix: index.html SIEMPRE revalida (no-cache). Sin esto, caches
    # heurísticas sirven HTML viejo que referencia chunks con nombres hash
    # del build anterior → 500/crash SPA tras re-deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy /api → backend (chi) -----------------------------------------
    # proxy_pass SIN URI: pasa el path original (backend enrutado /api/v1/...).
    # SSE (REQ-018) CRÍTICO: sin buffering en el proxy y timeouts largos, para
    # que el stream no muera a los 60s default. Las cookies pasan solas.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # SSE: no bufferizar la respuesta para que los eventos flujan ya.
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # Stowaway installer and architecture-specific checksummed binaries.
    # The installer is generated by Captain from the validated public Host;
    # the actual token is entered privately on the target server's TTY.
    location = /script.sh {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /downloads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
